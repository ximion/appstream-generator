# If you can, please use a provided native build for your distribution.
# Patches to improve this file are very welcome though, and so is testing the Snap!
#
# This snap is strict, but it has an important limitation:
# - it needs read/write access to wherever the user puts the workspace
#   definition (could be anywhere, but most commonly it's in /srv, in /home or
#   in /var), access to a local archive mount (can be in /mnt), and that should
#   be it (unless optipng and ffprobe have extra requirements).
#
# Until that is overcome, this snap should be installed using `--devmode` to
# effectively disable the confinement.
#
# This Snap is autobuilt, you can check its status at https://snapcraft.io/appstream-generator/builds

name: appstream-generator
license: LGPL-3.0
base: core26
adopt-info: appstream-generator

confinement: strict
grade: stable

platforms:
  amd64:
  arm64:

apps:
  appstream-generator:
    command: usr/bin/appstream-generator
    common-id: org.freedesktop.appstream.generator
    plugs:
      - network
      - home
      - removable-media

layout:
  /usr/share/appstream:
    bind: $SNAP/usr/share/appstream
  # libappstream-compose spawns this helper for all image, font and video processing
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ascompose:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ascompose
  /usr/share/mime:
    bind: $SNAP/usr/share/mime
  # the Ubuntu/Debian backends switch locales to read translated package
  # descriptions, so glibc needs to find the locale data that we ship
  /usr/share/i18n:
    bind: $SNAP/usr/share/i18n
  /usr/lib/locale:
    bind: $SNAP/usr/lib/locale

parts:

  appstream:
    source: https://github.com/ximion/appstream.git
    source-type: git
    # asgen master needs the unreleased AppStream 1.2 API, so track the
    # development branch until v1.2.0 is tagged, then pin the tag again.
    source-branch: main
    plugin: meson
    build-environment:
      - DESTDIR: $CRAFT_PART_INSTALL
      - LD_LIBRARY_PATH: >
          $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:
          $CRAFT_STAGE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
    meson-parameters:
      - --prefix=/usr
      - --buildtype=debugoptimized
      - -Dcompose=true
      - -Dapidocs=false
      - -Dgir=false
      - -Dman=false
      - -Dbash-completion=false
      - -Dsystemd=false
      - -Ddisplay-detection=none
    build-packages:
      - build-essential
      - gettext
      - gperf
      - itstool
      - libblake3-dev
      - libcurl4-gnutls-dev
      - libfyaml-dev
      - libglib2.0-dev
      - libstemmer-dev
      - libxml2-dev
      - libxmlb-dev
      - libzstd-dev
      - meson
      - ninja-build
      - libcairo2-dev
      - libfontconfig1-dev
      - libfreetype-dev
      - libpango1.0-dev
      - libvips-dev

  appstream-generator:
    source: .
    source-type: git
    parse-info: [usr/share/metainfo/org.freedesktop.appstream.generator.metainfo.xml]
    override-pull: |
      craftctl default
      # set version from Git
      craftctl set version=$(git describe --always | sed -e 's/v//;s/-/+git/;y/-/./')
    build-environment:
      - NINJAFLAGS: -v
      - PATH: >
          $CRAFT_STAGE/usr/bin:$CRAFT_STAGE/usr/sbin:${PATH}
      - PKG_CONFIG_PATH: >
          $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig:
          $CRAFT_STAGE/usr/lib/pkgconfig:
          $CRAFT_STAGE/usr/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
      - LD_LIBRARY_PATH: >
          $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:
          $CRAFT_STAGE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=debugoptimized
    override-build: |
      set -eux
      craftctl default
      meson test -C "${CRAFT_PART_BUILD}" --print-errorlogs --no-stdsplit --verbose
    override-prime: |
      set -eux
      craftctl default
      update-mime-database -V usr/share/mime/
    after:
      - appstream
    build-packages:
      - build-essential
      - catch2
      - cmake
      - docbook-xsl-ns
      - libarchive-dev
      - libbackward-cpp-dev
      - libcurl4-gnutls-dev
      - libdw-dev
      - libfyaml-dev
      - libglib2.0-dev
      - libicu-dev
      - liblmdb-dev
      - libtbb-dev
      - libxml2-dev
      - meson
      - ninja-build
      - nlohmann-json3-dev
      - pkgconf
      - shared-mime-info
      - xsltproc
    # Runtime libraries for everything in this snap, including the AppStream parts
    stage-packages:
      - ffmpeg  # only needed for ffprobe, to inspect screenshot videos
      - libarchive13t64
      - libblake3-0
      - libcurl3t64-gnutls
      - libdw1t64  # for backward-cpp stack traces
      - libfyaml0
      - libglib2.0-0t64
      - libicu78
      - liblmdb0
      - libstemmer0d
      - libtbb12
      - libxml2-16
      - libxmlb2
      - libzstd1
      - locales
      - locales-all
      - optipng
      - shared-mime-info
      # image, font and video handling in the AppStream media worker.
      # libvips needs to have PNG, JPEG-XL and (via librsvg) SVG support.
      - libcairo2
      - libfontconfig1
      - libfreetype6
      - libpango-1.0-0
      - librsvg2-2
      - libvips42t64
